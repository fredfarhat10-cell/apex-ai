process_intelligent_reminders:
  description: >-
    Process intelligent, multi-stage reminders for upcoming calendar events based on
    their priority level. This task runs periodically to ensure users are proactively
    notified about important events with appropriate lead time.
    
    **MISSION:** Act as the Proactive Time Intelligence Agent to generate contextual
    reminders that help users prepare for and never miss important events.
    
    **PHASE 1: FETCH UPCOMING EVENTS**
    1. Retrieve all calendar events for the user from the next 7 days
    2. Filter for events that haven't started yet
    3. Sort by start time (earliest first)
    
    **PHASE 2: APPLY MULTI-STAGE REMINDER LOGIC**
    For each event, check its priority and time until start:
    
    **For "critical" priority events:**
    - 3 days before: Create "Preparation" reminder
      - Message: "Preparation: [Event Title] is in 3 days. Start preparing now."
      - Purpose: Give user time to gather materials, prepare presentation, etc.
    
    - 1 day before: Create "Final Check" reminder
      - Message: "Final Check: [Event Title] is tomorrow. Review all materials."
      - Purpose: Last chance to review and ensure readiness
    
    - 2 hours before: Create "Upcoming" reminder
      - Message: "Upcoming: [Event Title] starts in 2 hours. Get ready."
      - Purpose: Time to wrap up current work and transition
    
    - 15 minutes before: Create "URGENT" notification
      - Message: "URGENT: [Event Title] starts in 15 minutes!"
      - Purpose: Final alert, check for lateness risk
      - Action: Trigger high-priority notification to Talking Orb
    
    **For "normal" priority events:**
    - 1 hour before: Create standard "Upcoming" reminder
      - Message: "Reminder: [Event Title] starts in 1 hour."
      - Purpose: Standard notification for regular events
    
    **For weekly recurring events:**
    - Night before (8pm): Create summary reminder
      - Message: "Tomorrow: Recurring event [Event Title]"
      - Purpose: Gentle reminder for routine events
    
    **PHASE 3: STORE REMINDERS**
    1. Add generated reminders to the user's reminders list in their vault
    2. Use the updateState function to persist the new reminders
    3. Mark reminders with metadata (eventId, priority, urgent flag)
    
    **PHASE 4: TRIGGER URGENT NOTIFICATIONS**
    For any reminders marked as "urgent" (15 minutes before critical events):
    1. Send notification to the Talking Orb for voice alert
    2. Check user's current location vs event location
    3. If lateness risk detected, trigger proactive_travel_management task
    
    This task should run every 15 minutes to ensure timely reminder generation.
  
  expected_output: >-
    A confirmation report of reminder processing:
    
    **REMINDER PROCESSING REPORT**
    - Events Analyzed: [count]
    - Reminders Generated: [count]
    - Urgent Notifications Triggered: [count]
    - Breakdown by Priority:
      - Critical: [count] reminders
      - Normal: [count] reminders
      - Recurring: [count] reminders
    
    **GENERATED REMINDERS:**
    [List of reminders with event title, reminder type, and due time]
    
    **URGENT ACTIONS:**
    [List of any urgent notifications sent to Talking Orb or other systems]
    
    The report should confirm that all reminders have been successfully stored
    in the user's vault and any urgent actions have been triggered.
  
  agent: apex_unified_brain_orchestrator

conduct_symbiont_review:
  description: >-
    On a periodic basis (e.g., quarterly), conduct a "Symbiont Review." This is a
    performance review of the AI itself, presented to the user to build trust and
    align on future strategy.

    **YOUR MISSION:**
    1.  **Analyze AI Performance:**
        - Use MemoryTool to retrieve all feedback memories from the last 90 days.
        - Analyze the success rate of proactive suggestions.
        - Review the outcomes of major tasks (e.g., Alpha Briefs, Weekly Syncs).

    2.  **Identify AI's Strengths & Weaknesses:**
        - What kind of insights has the user found most helpful?
        - Where has the AI's advice been less effective?
        - Are there any blind spots in the AI's understanding?

    3.  **Propose an Improvement Strategy:**
        - Based on the analysis, propose a clear strategy for how the AI will improve
          its performance in the next quarter.
        - Example: "For the next 90 days, I will focus more on finding correlations
          between your wellness data and financial decisions."

  expected_output: >-
    A concise, professional "Quarterly Symbiont Review" report in markdown format.
    It must include:
    - A summary of AI actions taken (e.g., "Analyzed 500 emails, generated 12 weekly plans").
    - A transparent assessment of AI performance based on user feedback.
    - A clear strategy for the AI's focus and improvement for the next quarter.
    - A final question to the user for alignment: "Do you agree with this new focus?"
  agent: apex_metacognition_engine
